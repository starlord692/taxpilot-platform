services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxpilot-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://taxpilot:taxpilot@postgres:5432/taxpilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16-alpine
    container_name: taxpilot-postgres
    environment:
      POSTGRES_DB: taxpilot
      POSTGRES_USER: taxpilot
      POSTGRES_PASSWORD: taxpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxpilot -d taxpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taxpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
